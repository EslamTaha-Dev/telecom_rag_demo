app:
  name: "Telecom RAG API"
  version: "1.0.0"
  description: "API for Telecom RAG"

data:
  vector_index_path: "faiss_telecom_index"
  chunk_size: 500
  chunk_overlap: 100
  batch_size: 50

models:
  embedding_provider: "huggingface"
  embedding_model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

  llm_provider: "gemini"
  llm_model_name: "gemini-3.6-flash"

  # Retrieval candidates.
  # We retrieve these first, then token-budget logic decides
  # how many chunks are actually sent to the LLM.
  k_retrieval: 20

  # Maximum input tokens allowed for the complete prompt.
  max_input_tokens: 2000

  # Maximum output tokens generated by Gemini.
  max_output_tokens: 1024

  # Gemini 3.x thinking level.
  # low = lower latency and cost.
  thinking_level: "low"

pricing:
  input_price_per_million: 0.75
  output_price_per_million: 3.75
